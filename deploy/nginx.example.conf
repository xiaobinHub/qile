# Template: current production domain pair. Inspect existing sites before applying.
# Retain ACME HTTP access for certificate renewal; both hosts share one SAN cert.
server {
    listen 80;
    server_name le.myprd.com leadmin.myprd.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/lele-growth-acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name le.myprd.com;
    ssl_certificate /etc/letsencrypt/live/le.myprd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/le.myprd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
server {
    listen 443 ssl;
    server_name leadmin.myprd.com;
    ssl_certificate /etc/letsencrypt/live/le.myprd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/le.myprd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
