# Template only. Replace domains/certificate paths before a separately authorized release.
server {
    listen 80;
    server_name chenqile.cn admin.chenqile.cn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name chenqile.cn;
    ssl_certificate /etc/letsencrypt/live/chenqile.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chenqile.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
server {
    listen 443 ssl;
    server_name admin.chenqile.cn;
    ssl_certificate /etc/letsencrypt/live/admin.chenqile.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.chenqile.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
