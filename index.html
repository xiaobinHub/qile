  <style>
    :root{--ink:#263238;--muted:#65727a;--paper:#fffdf8;--bg:#f5f1e8;--brand:#f08a5d;--brand2:#f6bd60;--green:#66a182;--blue:#5b8def;--red:#d95d5d;--line:#e6ded0;--shadow:0 14px 38px rgba(70,55,35,.12);--r:18px}
    *{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:linear-gradient(145deg,#fff8e8,#edf6ef 56%,#eef4ff);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    :focus-visible{outline:3px solid rgba(91,141,239,.45);outline-offset:2px}.app{max-width:1480px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;gap:18px;background:rgba(255,253,248,.92);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20;backdrop-filter:blur(14px)}
    .brand{display:flex;align-items:center;gap:11px;min-width:max-content}.brand-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,var(--brand2),var(--brand));font-size:25px;box-shadow:inset 0 1px #fff9}.brand strong{font-size:20px}.brand small{display:block;color:var(--muted)}
    .nav{display:flex;gap:6px;margin-left:15px}.nav button,.seg button{border:0;background:transparent;border-radius:12px;padding:9px 14px;font-weight:700;color:var(--muted)}.nav button.active,.seg button.active{background:#fff0e5;color:#a74d29}.balance-pill{margin-left:auto;background:#fff6cf;border:1px solid #f2dc82;border-radius:999px;padding:8px 14px;font-weight:800;white-space:nowrap}.balance-pill b{font-size:19px;color:#9a6200}
    main{margin-top:20px}.panel{background:rgba(255,253,248,.94);border:1px solid rgba(255,255,255,.95);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar h1{font-size:24px;margin:0 8px 0 0}.toolbar-spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:700}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(60,50,35,.08)}.btn.primary{background:linear-gradient(145deg,#f6a273,var(--brand));border-color:transparent;color:#fff}.btn.danger{color:#a83a3a;border-color:#ecc}.btn.soft{background:#f7f2e9}.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center}.seg{display:flex;background:#f2ece2;border-radius:14px;padding:3px}
    .weekday-row,.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday-row div{text-align:center;color:var(--muted);font-weight:700;padding:8px}.month-grid{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);gap:1px}.day-cell{min-height:126px;background:var(--paper);padding:8px;text-align:left;border:0;position:relative;overflow:hidden}.day-cell:hover{background:#fff8ee}.day-cell.out{background:#f5f2eb;color:#9ca3a6}.day-cell.today .day-num{background:var(--brand);color:#fff}.day-num{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;font-weight:800;margin-bottom:5px}.task-chip{display:flex;align-items:center;gap:5px;border-radius:8px;padding:3px 6px;margin:3px 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;border-left:4px solid var(--cat,#999)}.task-chip.done{text-decoration:line-through;opacity:.55}.more{font-size:12px;color:var(--muted);padding:3px 5px}
    .week-wrap{height:clamp(440px,calc(100vh - 240px),760px);overflow:auto;border:1px solid var(--line);border-radius:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}.week-board{min-width:920px;display:grid;grid-template-columns:58px repeat(7,1fr);background:var(--line);gap:1px}.week-head{background:var(--paper);padding:10px;text-align:center;font-weight:800;position:sticky;top:0;z-index:4}.week-head.today{color:var(--brand)}.time-axis,.week-col{height:1440px;position:relative;background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,#eee7db 59px,#eee7db 60px)}.time-label{position:absolute;right:8px;transform:translateY(-9px);font-size:11px;color:var(--muted)}.week-col{cursor:crosshair}.week-event{position:absolute;left:calc(4px + var(--event-offset,0px));right:auto;width:calc(100% - 8px - var(--event-offset,0px));border:1px solid #d9e0da;border-left:5px solid var(--cat);border-radius:7px;padding:4px 6px;background:#fff;box-shadow:0 2px 6px rgba(20,30,24,.1);color:var(--ink);font-size:11px;line-height:1.2;overflow:hidden;cursor:pointer;z-index:var(--event-z,2);text-align:left;transition:box-shadow .15s,border-color .15s,transform .15s}.week-event.stacked{box-shadow:0 3px 9px rgba(20,30,24,.14)}.week-event:hover,.week-event:focus-visible{z-index:20;border-color:#aebbb1;box-shadow:0 5px 13px rgba(20,30,24,.18);outline:0}.week-event-title{display:block;font-size:12px;font-weight:750;line-height:1.22;overflow-wrap:anywhere}.week-event-time{display:block;margin-top:2px;color:var(--muted);font-size:10px;line-height:1.15}.week-event.short{padding:2px 5px}.week-event.short .week-event-title{font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.week-event.done{opacity:.55;text-decoration:line-through}
    .drawer-backdrop{position:fixed;inset:0;background:#24303966;z-index:40}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:var(--paper);z-index:41;box-shadow:-18px 0 50px #0002;padding:22px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.drawer-head{display:flex;align-items:center;gap:10px}.drawer-head h2{margin:0;flex:1}.day-task{border:1px solid var(--line);border-left:6px solid var(--cat);border-radius:13px;padding:11px;margin:10px 0;background:#fff}.day-task.done{opacity:.65}.day-task-top{display:flex;gap:8px;align-items:start}.day-task-title{font-weight:800;flex:1}.meta{color:var(--muted);font-size:13px}.day-actions{display:flex;gap:7px;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:42px 15px}.empty .big{font-size:42px}
    dialog{border:0;border-radius:20px;padding:0;box-shadow:0 26px 70px #17202655;max-width:calc(100vw - 28px);background:var(--paper)}dialog::backdrop{background:#25333e77;backdrop-filter:blur(3px)}.modal{width:min(620px,92vw);max-height:88vh;overflow:auto}.modal.wide{width:min(980px,94vw)}.modal-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;flex:1}.modal-body{padding:20px}.modal-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:flex-end;gap:10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label,.field>span{font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #d9d0c3;border-radius:11px;padding:9px 10px;background:#fff}.field textarea{min-height:74px;resize:vertical}.error{color:var(--red);font-size:13px;min-height:18px}.notice{padding:10px 12px;border-radius:10px;background:#fff7d6;border:1px solid #eedb8c;color:#735b00;margin-bottom:12px}.repeat-box{border:1px dashed #dcc9ad;border-radius:14px;padding:13px;background:#fffaf1}.weekday-picks{display:flex;gap:6px;flex-wrap:wrap}.weekday-picks label{display:flex;align-items:center;gap:3px;background:#f3eee6;border-radius:8px;padding:6px 8px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{border-radius:16px;padding:17px;background:#fff;border:1px solid var(--line)}.stat span{color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:4px}.positive{color:#26845b}.negative{color:#bb4545}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.table-wrap{overflow:auto}.ledger{width:100%;border-collapse:collapse;min-width:680px}.ledger th,.ledger td{text-align:left;border-bottom:1px solid var(--line);padding:11px 9px}.ledger th{color:var(--muted);font-size:13px}.amount{font-weight:900}.amount.pos{color:#26845b}.amount.neg{color:#bb4545}
    .settings-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.settings-card{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.settings-card h2{margin-top:0}.category-row{display:grid;grid-template-columns:38px 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.category-row input[type=color]{width:34px;height:34px;border:0;background:transparent;padding:0}.category-row input[type=text]{border:1px solid var(--line);border-radius:9px;padding:7px}.muted{color:var(--muted)}

<body>
  <div id="root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="printPages" class="print-pages"></div>

  <dialog id="taskDialog"><form id="taskForm" class="modal" method="dialog"><div class="modal-head"><h2 id="taskDialogTitle">新建任务</h2><button class="btn icon-btn" type="button" data-close="taskDialog" aria-label="关闭">✕</button></div><div class="modal-body">
    <div id="taskNotice" class="notice hidden"></div>
    <section class="task-section" aria-labelledby="taskBasicTitle"><h3 class="section-title" id="taskBasicTitle">任务信息</h3><div class="form-grid">
      <div class="field full"><label for="taskTitle">任务内容 *</label><input id="taskTitle" maxlength="80" required placeholder="例如：朗读语文课文"></div>
      <div class="field full"><label for="taskNote">备注</label><textarea id="taskNote" maxlength="300" placeholder="可以写页码、要求或提醒"></textarea></div>
    </div></section>
    <section class="task-section section-divider" aria-labelledby="taskScheduleTitle"><h3 class="section-title" id="taskScheduleTitle">时间与奖励</h3><div class="form-grid">
      <div class="field"><label for="taskDate">日期 *</label><input id="taskDate" type="date" required></div><div class="field"><label for="taskCategory">任务类型 *</label><select id="taskCategory"></select></div>
      <div class="field"><label for="taskStart">开始时间 *</label><input id="taskStart" type="time" required></div><div class="field"><label for="taskEnd">结束时间 *</label><input id="taskEnd" type="time" required></div>
      <div class="field"><label for="taskPoints">奖励积分 *</label><input id="taskPoints" type="number" min="0" max="9999" step="1" required></div>
      <div class="field" id="scopeField"><label for="taskScope">修改范围</label><select id="taskScope"><option value="only">仅本次</option><option value="future">当天及以后</option><option value="all">整个系列</option></select></div>
    </div></section>
    <section class="repeat-panel" aria-labelledby="repeatTitle"><div class="repeat-toggle-row"><div class="repeat-toggle-copy"><strong id="repeatTitle">重复任务</strong><small>按固定规则自动安排后续任务</small></div><label class="switch"><input id="taskRepeat" type="checkbox"><span class="switch-track" aria-hidden="true"></span><span class="sr-only">开启重复任务</span></label></div><div id="repeatFields" class="hidden form-grid">
      <div class="field"><label for="repeatFreq">重复频率</label><select id="repeatFreq"><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option></select></div>
      <div class="field"><label for="repeatInterval">间隔</label><div class="interval-control"><span>每</span><input id="repeatInterval" type="number" min="1" max="99" value="1"><span id="intervalUnit">天</span></div></div>
      <div id="weeklyFields" class="field full hidden" role="group" aria-labelledby="weekdayLabel"><span id="weekdayLabel">每周重复日</span><div class="weekday-picks" id="weekdayPicks"></div></div>
      <div class="field"><label for="repeatEndType">结束方式</label><select id="repeatEndType"><option value="never">永不结束</option><option value="until">指定日期</option><option value="count">重复次数</option></select></div>
      <div class="field repeat-condition"><span>结束条件</span><label class="sr-only" for="repeatUntil">重复结束日期</label><input id="repeatUntil" class="hidden" type="date"><label class="sr-only" for="repeatCount">重复次数</label><input id="repeatCount" class="hidden" type="number" min="1" max="999" value="10"><span id="repeatNever" class="repeat-never">持续安排</span></div>
    </div></section>
    <div id="taskError" class="error" role="alert"></div></div><div class="modal-foot"><button id="deleteTaskBtn" class="btn danger hidden" type="button">删除任务</button><span class="toolbar-spacer"></span><button class="btn" type="button" data-close="taskDialog">取消</button><button class="btn primary" type="submit">保存任务</button></div></form></dialog>

  <dialog id="recurringDeleteDialog"><form class="modal" method="dialog"><div class="modal-head"><h2>删除重复任务</h2><button class="btn icon-btn" type="button" data-close="recurringDeleteDialog" aria-label="关闭">✕</button></div><div class="modal-body"><p>这是一个未完成的重复任务，想怎样删除？</p><p class="muted">“删除整个系列”会删除该重复系列的所有未完成安排；已完成的历史记录和积分流水会保留。</p></div><div class="modal-foot"><button class="btn" type="button" data-close="recurringDeleteDialog">取消</button><button id="deleteOnlyOccurrence" class="btn" type="button">仅删除本次</button><button id="deleteSeriesUnfinished" class="btn danger" type="button">删除整个系列</button></div></form></dialog>

  <dialog id="manualDialog"><form id="manualForm" class="modal" method="dialog"><div class="modal-head"><h2>手动调整积分</h2><button class="btn icon-btn" type="button" data-close="manualDialog">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="manualAmount">积分变动 *</label><input id="manualAmount" type="number" step="1" placeholder="正数加分，负数扣分" required></div><div class="field"><label for="manualDate">日期 *</label><input id="manualDate" type="date" required></div><div class="field full"><label for="manualReason">原因 *</label><input id="manualReason" maxlength="120" required placeholder="例如：主动整理书桌"></div></div><div id="manualError" class="error"></div></div><div class="modal-foot"><button class="btn" type="button" data-close="manualDialog">取消</button><button class="btn primary" type="submit">保存调整</button></div></form></dialog>

  <dialog id="printDialog"><form id="printForm" class="modal wide" method="dialog"><div class="modal-head"><h2>打印日程</h2><button class="btn icon-btn" type="button" data-close="printDialog">✕</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label for="printStart">开始日期</label><input id="printStart" type="date" required></div><div class="field"><label for="printEnd">结束日期</label><input id="printEnd" type="date" required></div></div><div class="print-range-actions" role="group" aria-label="快捷选择打印日期范围"><span>快捷选择</span><button id="printThisWeek" class="btn soft" type="button">本周</button><button id="printNextWeek" class="btn soft" type="button">下一周</button></div><div id="printError" class="error"></div><div id="printPreview" style="margin-top:15px"></div></div><div class="modal-foot"><button class="btn" type="button" data-close="printDialog">取消</button><button class="btn primary" type="submit">打印 A4 横向计划</button></div></form></dialog>

    function backup(){return {format:FORMAT,version:VERSION,exportedAt:new Date().toISOString(),data}}
    function download(obj,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

    async function importFile(file){try{const pkg=JSON.parse(await file.text()),next=validateBackup(pkg);const detail=`备份时间：${new Date(pkg.exportedAt).toLocaleString()}\n任务系列：${next.series.length}\n积分流水：${next.ledger.length}`;if(!confirm(`${detail}\n\n导入将整体替换当前数据，是否继续？`))return;if(data&&storageMeta.revision>0)downloadBackup();await Store.save(next,{repair:!data});data=next;corruptRaw=null;storageIssue='';render();toast('备份恢复成功')}catch(error){alert('导入失败：'+storageErrorMessage(error))}finally{$('#importInput').value=''}}
    function printWeekRange(day,offset=0){const start=addDays(startWeek(day),offset*7);return[start,addDays(start,6)]}
    function setPrintWeek(offset=0){const[start,end]=printWeekRange(dateStr(new Date()),offset);$('#printStart').value=start;$('#printEnd').value=end;$('#printError').textContent='';updatePrintPreview()}
    function openPrint(){setPrintWeek(0);$('#printDialog').showModal()}
    function isoWeek(date){const local=parseDate(date),d=new Date(Date.UTC(local.getFullYear(),local.getMonth(),local.getDate())),day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const year=d.getUTCFullYear(),yearStart=new Date(Date.UTC(year,0,1));return {year,week:Math.ceil((((d-yearStart)/86400000)+1)/7)}}
    function printTaskUnits(task){return 2+Math.ceil([...task.title].length/10)}
    function printDensity(list){const units=list.reduce((sum,task)=>sum+printTaskUnits(task),0);return units<=18?'normal':units<=30?'compact':units<=42?'dense':'overflow'}
    function printWeeks(from,to){const pages=[];for(let ws=startWeek(from);cmp(ws,to)<=0;ws=addDays(ws,7)){const dates=rangeDates(ws,addDays(ws,6)),items=occurrences(ws,addDays(ws,6)).filter(o=>cmp(o.date,from)>=0&&cmp(o.date,to)<=0),daily=dates.map(d=>items.filter(o=>o.date===d)),levels=daily.map(printDensity),density=levels.includes('overflow')?'overflow':levels.includes('dense')?'dense':levels.includes('compact')?'compact':'normal';pages.push({ws,dates,items,density})}return pages}
    function buildPrint(from,to){return printWeeks(from,to).map(p=>{const week=isoWeek(p.ws);return `<section class="print-page ${p.density}"><h1>乐乐成长计划 ${week.year}年 ${week.week}周</h1><div class="print-grid">${p.dates.map(d=>{const list=p.items.filter(o=>o.date===d),weekday='日一二三四五六'[parseDate(d).getDay()];return `<div class="print-day" style="${cmp(d,from)<0||cmp(d,to)>0?'color:#aaa':''}"><h3><span class="print-weekday">周${weekday}</span><small class="print-date">${fmtDate(d)}</small></h3>${list.map(o=>`<div class="paper-task"><span class="paper-check"></span><div><span class="paper-title">${esc(o.title)}</span><span class="paper-details">${esc(o.startTime)}–${esc(o.endTime)} · ${o.points} 分</span></div></div>`).join('')}</div>`}).join('')}</div><div class="print-footer"><div>本周获得积分：________</div><div>家长签字：________</div><div>备注：________________________</div></div></section>`}).join('')}
    function updatePrintPreview(){const from=$('#printStart').value,to=$('#printEnd').value;if(!from||!to||cmp(from,to)>0){$('#printError').textContent='请选择正确的起止日期';return false}const pages=printWeeks(from,to),overflow=pages.find(p=>p.density==='overflow');if(overflow){$('#printPreview').innerHTML='';$('#printError').textContent=`${fmtFull(overflow.ws)} 所在周任务过多，无法完整放入一张 A4 纸，请调整该周安排后再打印。`;return false}$('#printError').textContent='';const count=occurrences(from,to).length;$('#printPreview').innerHTML=`<div class="notice">将打印 ${pages.length} 页自然周计划，共 ${count} 项任务。</div>`;return true}

    function renderRecovery(){$('#root').innerHTML=`<section class="recovery"><h1>数据需要恢复</h1><p>${esc(storageIssue||'本机数据无法解析。为避免误删，工具没有自动清空它。')}</p><div class="notice">你可以先下载原始数据，再导入此前导出的有效备份。</div><p><button class="btn" id="rawDownload">下载原始数据</button> <button class="btn primary" id="recoverImport">导入备份</button> <button class="btn danger" id="recoverReset">确认重置</button></p></section>`;$('#rawDownload').onclick=async()=>{try{download(await Store.raw(),`乐乐成长-损坏数据-${dateStr(new Date())}.json`)}catch(error){alert(storageErrorMessage(error))}};$('#recoverImport').onclick=()=>$('#importInput').click();$('#recoverReset').onclick=async()=>{if(confirm('确定放弃当前损坏数据并重置吗？')){const next=defaults();try{await Store.save(next,{repair:true});data=next;corruptRaw=null;storageIssue='';render();toast('数据已重置')}catch(error){alert(storageErrorMessage(error))}}}}

    function renderConnectionError(){ $('#root').innerHTML=`<section class="recovery"><h1>无法连接本机数据服务</h1><p>${esc(storageIssue||'请双击“启动乐乐成长.command”后重试。')}</p><div class="notice">数据保存在项目目录中；服务未启动时，页面不会进入可编辑状态。</div><p><button class="btn primary" id="retryConnection">重新连接</button></p></section>`;$('#retryConnection').onclick=()=>location.reload()}
    function runSelfTests(){const tests=[];function test(name,fn){try{fn();tests.push([name,true])}catch(e){tests.push([name,false,e.message])}}function eq(a,b){if(JSON.stringify(a)!==JSON.stringify(b))throw Error(`${JSON.stringify(a)} != ${JSON.stringify(b)}`)}const d=defaults(),cat=d.categories[0].id;data=d;

    function openNativePicker(input){input.focus({preventScroll:true});if(typeof input.showPicker!=='function')return;try{input.showPicker()}catch{}}
    function activeCalendarScroll(){if(state.view!=='calendar')return null;return state.mode==='week'?$('#weekCalendar'):$('#monthCalendar')}
    function wheelPixels(e,calendar){const unit=e.deltaMode===1?16:e.deltaMode===2?calendar.clientHeight:1;return {top:e.deltaY*unit,left:e.deltaX*unit}}
    function flushCalendarScroll(){const top=calendarScroll.top,left=calendarScroll.left;calendarScroll.frame=0;calendarScroll.top=0;calendarScroll.left=0;const calendar=activeCalendarScroll();if(!calendar)return;calendar.scrollTop=Math.max(0,Math.min(calendar.scrollHeight-calendar.clientHeight,calendar.scrollTop+top));if(state.mode==='week')calendar.scrollLeft=Math.max(0,Math.min(calendar.scrollWidth-calendar.clientWidth,calendar.scrollLeft+left))}
    function redirectCalendarScroll(e){const calendar=activeCalendarScroll(),target=e.target;if(!calendar||target?.closest?.('dialog[open],.drawer,input,textarea,select,[contenteditable="true"]'))return;const delta=wheelPixels(e,calendar);if(!delta.top&&!delta.left)return;e.preventDefault();calendarScroll.top+=delta.top;calendarScroll.left+=delta.left;if(!calendarScroll.frame)calendarScroll.frame=requestAnimationFrame(flushCalendarScroll)}
    function wire(){document.addEventListener('click',e=>{const input=e.target.closest('input[type="date"],input[type="time"]');if(input)openNativePicker(input);const id=e.target.closest('[data-close]')?.dataset.close;if(id)$('#'+id).close()});document.addEventListener('wheel',redirectCalendarScroll,{passive:false});$('#taskForm').addEventListener('submit',saveTask);$('#deleteTaskBtn').onclick=deleteEditing;$('#deleteOnlyOccurrence').onclick=()=>finishRecurringDelete('only');$('#deleteSeriesUnfinished').onclick=()=>finishRecurringDelete('series');$('#confirmDeleteCategory').onclick=deleteCategory;$('#categoryCreateForm').addEventListener('submit',saveNewCategory);$('#taskRepeat').onchange=updateRepeatUI;$('#repeatFreq').onchange=updateRepeatUI;$('#repeatEndType').onchange=updateRepeatUI;$('#taskDate').onchange=()=>{if(!state.editing)buildWeekdays()};$('#manualForm').addEventListener('submit',saveManual);$('#printForm').addEventListener('submit',doPrint);$('#printThisWeek').onclick=()=>setPrintWeek(0);$('#printNextWeek').onclick=()=>setPrintWeek(1);$('#printStart').onchange=$('#printEnd').onchange=updatePrintPreview;$('#importInput').onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);$$('dialog').forEach(d=>d.addEventListener('cancel',()=>d.close()))}
    async function boot(){wire();if(SELFTEST){data=defaults();runSelfTests();return}if(location.protocol==='file:'){renderFileLaunch();return}$('#root').innerHTML='<section class="recovery"><h1>正在连接本机数据…</h1></section>';try{data=await Store.load();render()}catch(error){data=null;storageIssue=storageErrorMessage(error);if(error.kind==='corrupt')renderRecovery();else renderConnectionError()}}
    boot();
