<body>
  <div id="root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="printPages" class="print-pages"></div>

  <dialog id="taskDialog"><form id="taskForm" class="modal" method="dialog"><div class="modal-head"><h2 id="taskDialogTitle">新建任务</h2><button class="btn icon-btn" type="button" data-close="taskDialog" aria-label="关闭">✕</button></div><div class="modal-body">
    <div id="taskNotice" class="notice hidden"></div>
    <section class="task-section" aria-labelledby="taskBasicTitle"><h3 class="section-title" id="taskBasicTitle">任务信息</h3><div class="form-grid">
      <div class="field full"><label for="taskTitle">任务内容 *</label><input id="taskTitle" maxlength="80" required placeholder="例如：朗读语文课文"></div>
      <div class="field full"><label for="taskNote">备注</label><textarea id="taskNote" maxlength="300" placeholder="可以写页码、要求或提醒"></textarea></div>
    </div></section>
    <section class="task-section section-divider" aria-labelledby="taskScheduleTitle"><h3 class="section-title" id="taskScheduleTitle">时间与奖励</h3><div class="form-grid">
      <div class="field"><label for="taskDate">日期 *</label><input id="taskDate" type="date" required></div><div class="field"><label for="taskCategory">任务类型 *</label><select id="taskCategory"></select></div>
      <div class="field"><label for="taskStart">开始时间 *</label><input id="taskStart" type="time" required></div><div class="field"><label for="taskEnd">结束时间 *</label><input id="taskEnd" type="time" required></div>
      <div class="field"><label for="taskPoints">奖励积分 *</label><input id="taskPoints" type="number" min="0" max="9999" step="1" required></div>
      <div class="field" id="scopeField"><label for="taskScope">修改范围</label><select id="taskScope"><option value="only">仅本次</option><option value="future">当天及以后</option><option value="all">整个系列</option></select></div>
    </div></section>

  <dialog id="backupDialog"><section class="modal"><div class="modal-head"><h2>数据备份</h2><button class="btn icon-btn" type="button" data-close="backupDialog" aria-label="关闭">✕</button></div><div class="modal-body"><p class="dialog-note">建议每周导出一次完整 JSON 备份。导入会整体替换当前数据。</p><div class="day-actions"><button class="btn primary" id="exportBtn" type="button">导出备份</button><button class="btn" id="importBtn" type="button">导入并替换</button></div></div></section></dialog>

  <dialog id="categoryDeleteDialog"><section class="modal"><div class="modal-head"><h2>删除任务类型</h2><button class="btn icon-btn" type="button" data-close="categoryDeleteDialog" aria-label="关闭">✕</button></div><div class="modal-body"><p id="categoryDeleteMessage" class="dialog-note"></p></div><div class="modal-foot"><button class="btn" type="button" data-close="categoryDeleteDialog">取消</button><button class="btn danger" id="confirmDeleteCategory" type="button">确认删除</button></div></section></dialog>

  <input id="importInput" type="file" accept="application/json,.json" class="hidden">
  <script>
  (()=>{'use strict';
    const KEY='lele-task-manager.v1',VERSION=1,FORMAT='lele-task-manager-backup';
    const SELFTEST=new URLSearchParams(location.search).get('selftest')==='1';
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
    const pad=n=>String(n).padStart(2,'0');
    function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
    function dateStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
    function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return dateStr(d)}
    function startWeek(s){const d=parseDate(s),day=(d.getDay()+6)%7;return addDays(s,-day)}
    function monthStart(s){return s.slice(0,7)+'-01'}
    function daysInMonth(y,m){return new Date(y,m,0,12).getDate()}
    function cmp(a,b){return a<b?-1:a>b?1:0}
    function rangeDates(a,b){const out=[];for(let d=a;cmp(d,b)<=0;d=addDays(d,1))out.push(d);return out}
    function fmtDate(s){const d=parseDate(s);return `${d.getMonth()+1}月${d.getDate()}日`}
    function fmtFull(s){const d=parseDate(s),w='日一二三四五六'[d.getDay()];return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${w}`}
    function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
    function validId(s){return typeof s==='string'&&/^[A-Za-z0-9._:-]{1,100}$/.test(s)}
    function validColor(s){return typeof s==='string'&&/^#[0-9a-fA-F]{6}$/.test(s)}
    function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&dateStr(parseDate(s))===s}
    function validTime(s){return typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s)}
    function validRule(r,start){if(r==null)return true;if(!r||!['daily','weekly','monthly'].includes(r.freq)||!Number.isInteger(Number(r.interval))||Number(r.interval)<1||Number(r.interval)>99||!['never','until','count'].includes(r.endType))return false;if(r.freq==='weekly'&&(!Array.isArray(r.weekdays)||!r.weekdays.length||r.weekdays.some(x=>!Number.isInteger(Number(x))||Number(x)<0||Number(x)>6)))return false;if(r.freq==='monthly'&&(!Number.isInteger(Number(r.monthDay))||Number(r.monthDay)<1||Number(r.monthDay)>31))return false;if(r.endType==='until'&&(!validDate(r.until)||cmp(r.until,start)<0))return false;if(r.endType==='count'&&(!Number.isInteger(Number(r.count))||Number(r.count)<1||Number(r.count)>10000))return false;return true}
    function validTaskRecord(s,dateKey='startDate'){return !!s&&validId(s.id||s.seriesId)&&typeof s.title==='string'&&!!s.title.trim()&&validDate(s[dateKey])&&validTime(s.startTime)&&validTime(s.endTime)&&minutes(s.endTime)>minutes(s.startTime)&&validId(s.categoryId)&&Number.isInteger(Number(s.points))&&Number(s.points)>=0}
    function defaults(){return {schemaVersion:VERSION,settings:{childName:'乐乐',weekStartsOn:1},categories:[['作业','#e56b6f'],['学习','#5b8def'],['阅读','#8e7dbe'],['锻炼','#52a675'],['家务','#e6a23c'],['其他','#7a8b99']].map(([name,color])=>({id:uid(),name,color,active:true})),series:[],exceptions:[],completions:[],ledger:[]}}
    function validateData(d){if(!d||d.schemaVersion!==VERSION)throw Error(d?.schemaVersion>VERSION?'备份来自更高版本，当前工具无法读取':'数据版本不受支持');for(const k of ['settings','categories','series','exceptions','completions','ledger'])if(!(k in d))throw Error(`缺少数据项：${k}`);for(const k of ['categories','series','exceptions','completions','ledger'])if(!Array.isArray(d[k]))throw Error(`数据项 ${k} 格式不正确`);if(!d.settings||typeof d.settings!=='object')throw Error('设置数据格式不正确');const ids=new Set(d.categories.map(x=>x?.id));if(ids.size!==d.categories.length||d.categories.some(x=>!x||!validId(x.id)||typeof x.name!=='string'||!x.name.trim()||!validColor(x.color)||typeof x.active!=='boolean'))throw Error('任务类型数据不完整或存在重复标识');const seriesIds=new Set(d.series.map(x=>x?.id));if(seriesIds.size!==d.series.length)throw Error('任务系列存在重复标识');for(const s of d.series){if(!validTaskRecord(s)||!validRule(s.recurrence,s.startDate))throw Error(`任务“${s?.title||''}”数据不完整`);if(!ids.has(s.categoryId))throw Error(`任务“${s.title||''}”引用了不存在的类型`)}for(const ex of d.exceptions){if(!ex||!validId(ex.id||'legacy')||!seriesIds.has(ex.seriesId)||!validDate(ex.originalDate)||!['cancel','override'].includes(ex.action))throw Error('重复任务例外数据不完整');if(ex.action==='override'&&(!validTaskRecord(ex.data,'date')||!ids.has(ex.data.categoryId)))throw Error('重复任务覆盖内容不完整')}for(const c of d.completions)if(!c||typeof c.occurrenceKey!=='string'||typeof c.completed!=='boolean'||!validTaskRecord(c.snapshot,'date')||!ids.has(c.snapshot.categoryId))throw Error('完成记录快照不完整');for(const x of d.ledger)if(!x||!validId(x.id)||!['task-complete','task-reversal','manual'].includes(x.kind)||!Number.isInteger(Number(x.amount))||!validDate(x.date)||Number.isNaN(Date.parse(x.createdAt))||(x.kind==='manual'&&(!x.reason||typeof x.reason!=='string')))throw Error('积分流水记录不完整');return d}
    let corruptRaw=null;
    const Store={load(){if(SELFTEST)return defaults();try{const raw=localStorage.getItem(KEY);return raw?validateData(JSON.parse(raw)):defaults()}catch(e){try{corruptRaw=localStorage.getItem(KEY)}catch{};return null}},save(data){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('保存失败，请立即导出备份');return false}}};
    let data=Store.load();
    const state={view:'calendar',mode:'month',cursor:dateStr(new Date()),selectedDate:null,editing:null,deletingCategoryId:null};
    function category(id){return data.categories.find(x=>x.id===id)||{name:'已停用类型',color:'#888'}}
    function endAllows(rule,date,index){if(!rule)return index===0;if(rule.endType==='until'&&cmp(date,rule.until)>0)return false;if(rule.endType==='count'&&index>=Number(rule.count))return false;return true}
    function baseOccurrences(s,from,to){if(!s.recurrence)return cmp(s.startDate,from)>=0&&cmp(s.startDate,to)<=0?[makeOcc(s,s.startDate)]:[];const r=s.recurrence,out=[],hardEnd=r.endType==='until'?r.until:to,limit=cmp(hardEnd,to)<0?hardEnd:to,maxCount=r.endType==='count'?Number(r.count):5000;let generated=0;
      if(r.freq==='daily'){for(let d=s.startDate;cmp(d,limit)<=0&&generated<maxCount;d=addDays(d,Number(r.interval))){if(endAllows(r,d,generated)&&cmp(d,from)>=0)out.push(makeOcc(s,d));generated++}}
      if(r.freq==='weekly'){const anchor=startWeek(s.startDate),days=(r.weekdays||[]).map(Number).sort((a,b)=>a-b);for(let w=0;generated<maxCount;w+=Number(r.interval)){const ws=addDays(anchor,w*7);if(cmp(ws,limit)>0)break;for(const wd of days){const d=addDays(ws,wd);if(cmp(d,s.startDate)<0||cmp(d,limit)>0)continue;if(!endAllows(r,d,generated))break;if(cmp(d,from)>=0)out.push(makeOcc(s,d));generated++;if(generated>=maxCount)break}}}
      if(r.freq==='monthly'){const a=parseDate(s.startDate),anchorDay=r.monthDay||a.getDate();for(let i=0;generated<maxCount;i+=Number(r.interval)){const rawMonth=a.getMonth()+i,y=a.getFullYear()+Math.floor(rawMonth/12),m=((rawMonth%12)+12)%12+1,d=`${y}-${pad(m)}-${pad(Math.min(anchorDay,daysInMonth(y,m)))}`;if(cmp(d,limit)>0)break;if(!endAllows(r,d,generated))break;if(cmp(d,s.startDate)>=0&&cmp(d,from)>=0)out.push(makeOcc(s,d));generated++}}
      return out}
    function makeOcc(s,date,originalDate=date){return {seriesId:s.id,occurrenceKey:`${s.id}@${originalDate}`,originalDate,date,title:s.title,note:s.note||'',startTime:s.startTime,endTime:s.endTime,categoryId:s.categoryId,points:Number(s.points)||0,recurring:!!s.recurrence}}
    function occurrences(from,to){let out=data.series.flatMap(s=>baseOccurrences(s,from,to));const byKey=new Map(out.map(o=>[o.occurrenceKey,o]));for(const ex of data.exceptions){const key=`${ex.seriesId}@${ex.originalDate}`;if(ex.action==='cancel')byKey.delete(key);else if(ex.action==='override'){byKey.delete(key);const o={...ex.data,seriesId:ex.seriesId,originalDate:ex.originalDate,occurrenceKey:key,recurring:true};if(cmp(o.date,from)>=0&&cmp(o.date,to)<=0)byKey.set(key,o)}}for(const c of data.completions.filter(x=>x.completed)){const o={...c.snapshot,occurrenceKey:c.occurrenceKey};if(cmp(o.date,from)>=0&&cmp(o.date,to)<=0)byKey.set(c.occurrenceKey,o)}out=[...byKey.values()];return out.sort((a,b)=>cmp(a.date,b.date)||cmp(a.startTime,b.startTime)||cmp(a.title,b.title))}
    function completion(key){return data.completions.find(x=>x.occurrenceKey===key)}
    function isDone(o){return !!completion(o.occurrenceKey)?.completed}
    function balance(){return data.ledger.reduce((n,x)=>n+Number(x.amount),0)}
    function cloneData(){return JSON.parse(JSON.stringify(data))}
    function persist(msg,before){if(Store.save(data)){render();if(msg)toast(msg);return true}if(before)data=before;render();return false}
    let toastTimer;function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
    function appShell(){return `<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">乐</div><div><strong>乐乐成长计划</strong><small>今天也向前一小步</small></div></div><nav class="nav" aria-label="主导航"><button data-view="calendar">日历</button><button data-view="points">积分流水</button><button data-view="settings">设置</button></nav><div class="balance-pill">当前积分 <b>${balance()}</b></div></header><main id="main"></main></div>`}
    function render(){if(!data){renderRecovery();return}$('#root').innerHTML=appShell();$$('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.onclick=()=>{state.view=b.dataset.view;render()}});if(state.view==='calendar')renderCalendar();if(state.view==='points')renderPoints();if(state.view==='settings')renderSettings()}
    function calendarRange(){if(state.mode==='month'){const first=monthStart(state.cursor),start=startWeek(first),d=parseDate(first);d.setMonth(d.getMonth()+1);const last=addDays(dateStr(d),-1);return [start,addDays(startWeek(last),6)]}const start=startWeek(state.cursor);return[start,addDays(start,6)]}
    function renderCalendar(){const main=$('#main'),[from,to]=calendarRange(),items=occurrences(from,to),cur=parseDate(state.cursor),title=state.mode==='month'?`${cur.getFullYear()}年${cur.getMonth()+1}月`:`${fmtDate(from)} — ${fmtDate(to)}`;main.innerHTML=`<section class="panel"><div class="toolbar"><h1>${title}</h1><button class="btn icon-btn" id="prevPeriod" aria-label="上一期">‹</button><button class="btn" id="todayBtn">今天</button><button class="btn icon-btn" id="nextPeriod" aria-label="下一期">›</button><div class="toolbar-spacer"></div><div class="seg"><button data-mode="month">月</button><button data-mode="week">周</button></div><button class="btn" id="printBtn">打印</button><button class="btn primary" id="newTaskBtn">新建任务</button></div><div id="calendarBody"></div></section>`;
      $('#prevPeriod').onclick=()=>movePeriod(-1);$('#nextPeriod').onclick=()=>movePeriod(1);$('#todayBtn').onclick=()=>{state.cursor=dateStr(new Date());render()};$('#newTaskBtn').onclick=()=>openTask({date:state.selectedDate||dateStr(new Date())});$('#printBtn').onclick=openPrint;$$('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.onclick=()=>{state.mode=b.dataset.mode;render()}});state.mode==='month'?renderMonth(items,from,to):renderWeek(items,from)}

    function download(obj,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([typeof obj==='string'?obj:JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    function downloadBackup(){download(backup(),`乐乐成长备份-${dateStr(new Date())}.json`);toast('备份已导出')}
    function validateBackup(obj){if(!obj||obj.format!==FORMAT||obj.version!==VERSION||!obj.data)throw Error('不是有效的乐乐成长备份');return validateData(obj.data)}
    async function importFile(file){try{const pkg=JSON.parse(await file.text()),next=validateBackup(pkg);const detail=`备份时间：${new Date(pkg.exportedAt).toLocaleString()}\n任务系列：${next.series.length}\n积分流水：${next.ledger.length}`;if(!confirm(`${detail}\n\n导入将整体替换当前数据，是否继续？`))return;if(data)downloadBackup();else if(corruptRaw)download(corruptRaw,`乐乐成长-导入前损坏数据-${dateStr(new Date())}.json`);if(!Store.save(next))return;data=next;corruptRaw=null;render();toast('备份恢复成功')}catch(e){alert('导入失败：'+e.message)}finally{$('#importInput').value=''}}
    function printWeekRange(day,offset=0){const start=addDays(startWeek(day),offset*7);return[start,addDays(start,6)]}
    function setPrintWeek(offset=0){const[start,end]=printWeekRange(dateStr(new Date()),offset);$('#printStart').value=start;$('#printEnd').value=end;$('#printError').textContent='';updatePrintPreview()}
    function openPrint(){setPrintWeek(0);$('#printDialog').showModal()}
    function chunkPrintDay(list){const chunks=[[]];let units=0;for(const task of list){const taskUnits=2+Math.ceil([...task.title].length/10),current=chunks[chunks.length-1];if(current.length&&(current.length>=8||units+taskUnits>18)){chunks.push([]);units=0}chunks[chunks.length-1].push(task);units+=taskUnits}return chunks}
    function printWeeks(from,to){const pages=[];for(let ws=startWeek(from);cmp(ws,to)<=0;ws=addDays(ws,7)){const dates=rangeDates(ws,addDays(ws,6)),all=occurrences(ws,addDays(ws,6)).filter(o=>cmp(o.date,from)>=0&&cmp(o.date,to)<=0),byDay=Object.fromEntries(dates.map(d=>[d,chunkPrintDay(all.filter(o=>o.date===d))])),parts=Math.max(1,...dates.map(d=>byDay[d].length));for(let part=0;part<parts;part++){const items=dates.flatMap(d=>byDay[d][part]||[]);pages.push({ws,dates,items,part:part+1,parts})}}return pages}
    function buildPrint(from,to){return printWeeks(from,to).map(p=>`<section class="print-page"><h1>乐乐成长计划${p.parts>1?` · 续页 ${p.part}/${p.parts}`:''}</h1><div class="range">${fmtFull(p.dates[0])} — ${fmtFull(p.dates[6])}</div><div class="print-grid">${p.dates.map(d=>{const list=p.items.filter(o=>o.date===d);return `<div class="print-day" style="${cmp(d,from)<0||cmp(d,to)>0?'color:#aaa':''}"><h3>${fmtDate(d)}<br><small>周${'日一二三四五六'[parseDate(d).getDay()]}</small></h3>${list.map(o=>`<div class="paper-task"><span class="paper-check"></span><b>${esc(o.startTime)}</b> ${esc(o.title)}<br><small>${esc(category(o.categoryId).name)} · ${o.points} 分</small></div>`).join('')}</div>`}).join('')}</div><div class="print-footer"><div>本周获得积分：________</div><div>家长签字：________</div><div>备注：________________________</div></div></section>`).join('')}
    function updatePrintPreview(){const from=$('#printStart').value,to=$('#printEnd').value;if(!from||!to||cmp(from,to)>0){$('#printError').textContent='请选择正确的起止日期';return false}$('#printError').textContent='';const pages=printWeeks(from,to),count=occurrences(from,to).length;$('#printPreview').innerHTML=`<div class="notice">将打印 ${pages.length} 页自然周计划，共 ${count} 项任务。</div>`;return true}
    function doPrint(e){e.preventDefault();if(!updatePrintPreview())return;$('#printPages').innerHTML=buildPrint($('#printStart').value,$('#printEnd').value);$('#printDialog').close();setTimeout(()=>window.print(),60)}
    function renderRecovery(){$('#root').innerHTML=`<section class="recovery"><h1>数据需要恢复</h1><p>浏览器中的本地数据无法解析。为避免误删，工具没有自动清空它。</p><div class="notice">你可以先下载原始数据，再导入此前导出的有效备份。</div><p><button class="btn" id="rawDownload">下载原始数据</button> <button class="btn primary" id="recoverImport">导入备份</button> <button class="btn danger" id="recoverReset">确认重置</button></p></section>`;$('#rawDownload').onclick=()=>download(corruptRaw||'',`乐乐成长-损坏数据-${dateStr(new Date())}.json`);$('#recoverImport').onclick=()=>$('#importInput').click();$('#recoverReset').onclick=()=>{if(confirm('确定放弃当前损坏数据并重置吗？')){const next=defaults();if(Store.save(next)){data=next;corruptRaw=null;render()}}}}
    function runSelfTests(){const tests=[];function test(name,fn){try{fn();tests.push([name,true])}catch(e){tests.push([name,false,e.message])}}function eq(a,b){if(JSON.stringify(a)!==JSON.stringify(b))throw Error(`${JSON.stringify(a)} != ${JSON.stringify(b)}`)}const d=defaults(),cat=d.categories[0].id;data=d;
      test('本地日期跨年',()=>eq(addDays('2026-12-31',1),'2027-01-01'));
      test('周一是一周起点',()=>eq(startWeek('2026-08-25'),'2026-08-24'));
      test('每日间隔与次数结束',()=>{d.series=[{id:'a',title:'A',startDate:'2026-01-01',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'daily',interval:2,endType:'count',count:3}}];eq(occurrences('2026-01-01','2026-01-10').map(x=>x.date),['2026-01-01','2026-01-03','2026-01-05'])});
      test('每周多个星期',()=>{d.series=[{id:'b',title:'B',startDate:'2026-08-24',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'weekly',interval:1,weekdays:[0,2,4],endType:'count',count:4}}];eq(occurrences('2026-08-24','2026-09-06').map(x=>x.date),['2026-08-24','2026-08-26','2026-08-28','2026-08-31'])});
      test('月末回退后重新锚定',()=>{d.series=[{id:'c',title:'C',startDate:'2024-01-31',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'monthly',interval:1,monthDay:31,endType:'count',count:3}}];eq(occurrences('2024-01-01','2024-04-01').map(x=>x.date),['2024-01-31','2024-02-29','2024-03-31'])});
      test('单次取消例外',()=>{d.series=[{id:'d',title:'D',startDate:'2026-01-01',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'daily',interval:1,endType:'count',count:2}}];d.exceptions=[{seriesId:'d',originalDate:'2026-01-01',action:'cancel'}];eq(occurrences('2026-01-01','2026-01-02').map(x=>x.date),['2026-01-02'])});
      test('仅删除重复任务本次安排',()=>{const s={id:'delete-only',title:'仅删一次',startDate:'2026-01-01',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'daily',interval:1,endType:'count',count:3}},snap=makeOcc(s,'2026-01-01'),completed=[{occurrenceKey:s.id+'@2026-01-01',completed:true,snapshot:snap}],ledger=[{id:'keep-only-ledger',kind:'task-complete',amount:1,date:'2026-01-01',createdAt:'2026-01-01T08:30:00Z'}],completedBefore=JSON.parse(JSON.stringify(completed)),ledgerBefore=JSON.parse(JSON.stringify(ledger));d.series=[s];d.exceptions=[];d.completions=completed;d.ledger=ledger;removeRecurringArrangement(makeOcc(s,'2026-01-02'),'only');eq(occurrences('2026-01-01','2026-01-03').map(x=>x.date),['2026-01-01','2026-01-03']);eq(data.completions,completedBefore);eq(data.ledger,ledgerBefore)});
      test('删除重复系列保留完成与流水',()=>{const s={id:'delete-series',title:'删系列',startDate:'2026-01-01',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'daily',interval:1,endType:'count',count:3}},snap=makeOcc(s,'2026-01-01'),completions=[{occurrenceKey:s.id+'@2026-01-01',completed:true,snapshot:snap}],ledger=[{id:'keep-ledger',kind:'task-complete',amount:1,date:'2026-01-01',createdAt:'2026-01-01T08:30:00Z'}],completionsBefore=JSON.parse(JSON.stringify(completions)),ledgerBefore=JSON.parse(JSON.stringify(ledger));d.series=[s];d.exceptions=[];d.completions=completions;d.ledger=ledger;removeRecurringArrangement(makeOcc(s,'2026-01-02'),'series');eq(occurrences('2026-01-01','2026-01-03').map(x=>x.date),['2026-01-01']);eq(data.completions,completionsBefore);eq(data.ledger,ledgerBefore)});
      test('按次数系列从中间拆分不增加总次数',()=>{const s={id:'split',title:'拆分',startDate:'2026-01-01',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'daily',interval:2,endType:'count',count:3}};d.series=[s];d.exceptions=[];d.completions=[];const old=makeOcc(s,'2026-01-03'),next={title:'拆分后',note:'',startDate:'2026-01-03',startTime:'09:00',endTime:'09:30',categoryId:cat,points:2,recurrence:{...s.recurrence}};applyEdit(old,next,'future');eq(occurrences('2026-01-01','2026-01-10').map(x=>x.date),['2026-01-01','2026-01-03','2026-01-05'])});
      test('整系列编辑保留原始月度锚点',()=>{const s={id:'whole',title:'整系列',startDate:'2024-01-31',startTime:'08:00',endTime:'08:30',categoryId:cat,points:1,recurrence:{freq:'monthly',interval:1,monthDay:31,endType:'count',count:3}};d.series=[s];const old=makeOcc(s,'2024-02-29'),next={title:'整系列新标题',note:'',startDate:'2024-02-29',startTime:'09:00',endTime:'09:30',categoryId:cat,points:2,recurrence:{freq:'monthly',interval:1,monthDay:29,endType:'count',count:3}};applyEdit(old,next,'all');eq([s.startDate,s.recurrence.monthDay],['2024-01-31',31])});
      test('积分余额与冲正',()=>{d.ledger=[{id:'l1',kind:'task-complete',amount:5,date:'2026-01-01',createdAt:'2026-01-01T08:00:00Z'},{id:'l2',kind:'task-reversal',amount:-5,date:'2026-01-01',createdAt:'2026-01-01T09:00:00Z'},{id:'l3',kind:'task-complete',amount:3,date:'2026-01-02',createdAt:'2026-01-02T08:00:00Z'}];eq(balance(),3)});
      test('有效备份通过校验',()=>eq(validateBackup({format:FORMAT,version:1,data:d}),d));
      test('损坏流水会被备份校验拒绝',()=>{let rejected=false;try{validateBackup({format:FORMAT,version:1,data:{...d,ledger:[null]}})}catch{rejected=true}if(!rejected)throw Error('损坏流水未被拒绝')});
      test('超长打印任务自动分续页',()=>{const chunks=chunkPrintDay(Array.from({length:5},(_,i)=>({title:`${i}一段很长的任务内容`.repeat(6)})));if(chunks.length<2)throw Error('长任务没有分页')});
      test('原生选择器安全回退',()=>{let focus=0,picker=0;openNativePicker({focus(){focus++},showPicker(){picker++;throw Error('blocked')}});openNativePicker({focus(){focus++}});eq([focus,picker],[2,1])});
      test('打印快捷周范围',()=>{eq(printWeekRange('2026-12-31'),['2026-12-28','2027-01-03']);eq(printWeekRange('2026-12-31',1),['2027-01-04','2027-01-10'])});
      test('任务类型删除保留历史引用',()=>{const unused={id:'unused-cat',name:'未使用',color:'#123456',active:true},used={id:'used-cat',name:'已使用',color:'#654321',active:true};d.categories=[unused,used];d.series=[];d.exceptions=[];d.completions=[];data=d;eq(removeCategoryRecord(unused.id),false);eq(data.categories.map(x=>x.id),['used-cat']);data.series=[{categoryId:'used-cat'}];eq(removeCategoryRecord('used-cat'),true);eq(data.categories[0].active,false)});
      $('#root').innerHTML=`<main class="selftests"><h1>乐乐成长计划 · 自检</h1><p>测试模式不会读取或写入正式本地数据。</p><h2>${tests.filter(x=>x[1]).length}/${tests.length} 通过</h2>${tests.map(x=>`<p class="${x[1]?'test-pass':'test-fail'}">${x[1]?'✓':'✗'} ${esc(x[0])}${x[2]?` — ${esc(x[2])}`:''}</p>`).join('')}</main>`;document.title=`${tests.every(x=>x[1])?'PASS':'FAIL'} · 乐乐成长自检`}
    function openNativePicker(input){input.focus({preventScroll:true});if(typeof input.showPicker!=='function')return;try{input.showPicker()}catch{}}
    function wire(){document.addEventListener('click',e=>{const input=e.target.closest('input[type="date"],input[type="time"]');if(input)openNativePicker(input);const id=e.target.closest('[data-close]')?.dataset.close;if(id)$('#'+id).close()});$('#taskForm').addEventListener('submit',saveTask);$('#deleteTaskBtn').onclick=deleteEditing;$('#deleteOnlyOccurrence').onclick=()=>finishRecurringDelete('only');$('#deleteSeriesUnfinished').onclick=()=>finishRecurringDelete('series');$('#confirmDeleteCategory').onclick=deleteCategory;$('#taskRepeat').onchange=updateRepeatUI;$('#repeatFreq').onchange=updateRepeatUI;$('#repeatEndType').onchange=updateRepeatUI;$('#taskDate').onchange=()=>{if(!state.editing)buildWeekdays()};$('#manualForm').addEventListener('submit',saveManual);$('#printForm').addEventListener('submit',doPrint);$('#printThisWeek').onclick=()=>setPrintWeek(0);$('#printNextWeek').onclick=()=>setPrintWeek(1);$('#printStart').onchange=$('#printEnd').onchange=updatePrintPreview;$('#importInput').onchange=e=>e.target.files[0]&&importFile(e.target.files[0]);$$('dialog').forEach(d=>d.addEventListener('cancel',()=>d.close()))}
    wire();SELFTEST?runSelfTests():render();
  })();
  </script>
