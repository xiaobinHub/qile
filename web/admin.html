<head>

  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#25382d;background:#f5f7f3;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button,.button{border:1px solid #cdd8cf;background:#fff;border-radius:9px;padding:9px 14px;color:#345440}.primary{background:#34734f;color:#fff;border-color:#34734f}.danger{color:#a13e3e}input{border:1px solid #cdd8cf;border-radius:9px;padding:10px 12px;min-width:0}input:focus{outline:2px solid #a6c8af;outline-offset:1px}label{display:grid;gap:7px;font-weight:600}small,.muted{color:#758278}h1{font-size:25px;letter-spacing:-.03em;margin:0}h2{font-size:19px;margin:0 0 20px}.layout{max-width:1180px;margin:auto;padding:30px 24px}.header{display:flex;align-items:center;gap:12px;margin-bottom:28px}.header .brand{flex:1}.header p{margin:5px 0 0;color:#758278}.mark{width:43px;height:43px;display:grid;place-items:center;background:#34734f;border-radius:13px;color:#fff;font-weight:750;font-size:22px}.panel{padding:24px;border:1px solid #e0e7df;background:white;border-radius:16px;margin-bottom:20px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar h2{margin:0;flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.field-actions{display:flex;gap:10px;align-items:end}.error{color:#a13e3e;min-height:22px;margin:12px 0 0}.success{color:#34734f}.auth{max-width:450px;margin:10vh auto}.auth form,.profile-form{display:grid;gap:17px}.auth p{color:#758278;line-height:1.7}.badge{display:inline-block;border-radius:20px;padding:4px 9px;font-size:12px;background:#edf5ee;color:#39734f}.badge.disabled{background:#f8ece9;color:#98534d}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:12px;color:#758278;font-weight:600;background:#f8faf7}td,th{padding:14px 12px;border-bottom:1px solid #edf0eb;white-space:nowrap}td small{display:block;margin-top:4px}.actions{display:flex;gap:7px}.actions button{padding:6px 10px;font-size:13px}.notice{padding:12px 15px;border-radius:9px;background:#f1f6ef;color:#5d725e;line-height:1.7}.profile-form{max-width:520px}.screen-title{margin-bottom:22px}.spacer{flex:1}#search{width:240px}@media(max-width:700px){.layout{padding:18px 12px}.header{flex-wrap:wrap}.panel{padding:18px 14px}.grid{grid-template-columns:1fr}.header h1{font-size:21px}.toolbar{align-items:stretch}#search{width:100%}.actions{flex-wrap:wrap}}
