  (()=>{
    const root=document.getElementById('mison-wireframes');
    const teachers=[{id:'jenyy',name:'Jenyy',initial:'J',intro:'互动自然，善于引导孩子开口表达。',tags:['少儿','互动','亲和'],favorite:true,recommended:false},{id:'mayren',name:'Mayren',initial:'M',intro:'注重发音与表达，课堂节奏清晰。',tags:['纠音','严谨'],favorite:false,recommended:false},{id:'rina',name:'Rina',initial:'R',intro:'课堂活泼，适合英语启蒙与口语练习。',tags:['少儿','活泼'],favorite:true,recommended:true}];
    const lessons=['PU027 U3 Food shopping L7 故事','PU028 U3 Food shopping L8 复习','PU029 U4 At home L1 词汇','PU030 U4 At home L2 对话'];
    const state={scene:'schedule',step:'schedule',overlay:null,teacher:'jenyy',favorites:false,slots:[],day:4,query:'',bookingTab:'upcoming',sort:false,courseIndex:0,pickedCourse:2,chosenCourses:[0,1],connected:true,filterValues:[],booked:false,cancelled:false,toast:''};
    const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const teacher=()=>teachers.find(t=>t.id===state.teacher)||teachers[0];
    const minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3));
    const timeEnd=s=>{const n=minutes(s)+25;return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};

      if(b.dataset.preview!==undefined){state.courseIndex=Number(b.dataset.preview);state.overlay='preview';render();return;}
      if(b.dataset.bookingTab){state.bookingTab=b.dataset.bookingTab;state.sort=false;renderOverlay();return;}

      else if(a==='continue'){state.step='schedule';state.scene='schedule';state.slots=[];}
      else if(a==='use-course'){state.chosenCourses[state.courseIndex]=state.pickedCourse;state.overlay=null;state.scene='confirm';}

    function restore(saved){const v=saved?.privateContent;if(v&&['schedule','favorites','confirm','bookings','courseware','teacher','account','success'].includes(v.scene)){if(teachers.some(t=>t.id===v.teacher))state.teacher=v.teacher;scene(v.scene,false);}else render();}
    restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved&&!(saved.privateContent?.scene===state.scene&&saved.privateContent?.teacher===state.teacher))restore(saved);});
  })();
  </script>
</div>
